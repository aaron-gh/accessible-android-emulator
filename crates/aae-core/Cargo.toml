[package]
name = "aae-core"
description = "Core library for the Accessible Android Emulator: SDK, devices, emulator control, audio and speech."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
prost.workspace = true
prost-types.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
cpal.workspace = true
ringbuf.workspace = true
directories.workspace = true
tracing.workspace = true
ureq.workspace = true
sha1.workspace = true
sha2.workspace = true
roxmltree.workspace = true
signalsmith-stretch.workspace = true
zip.workspace = true

[build-dependencies]
tonic-prost-build.workspace = true
protox.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Time"] }

[dev-dependencies]
anyhow.workspace = true
