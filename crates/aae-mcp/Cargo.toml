[package]
name = "aae-mcp"
description = "AAE's MCP server, so AI agents can run, use and inspect accessible Android devices."
version.workspace = true
edition.workspace = true
rust-version = "1.88"
license.workspace = true

[dependencies]
aae-core.workspace = true
aae-ffi = { path = "../aae-ffi" }
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
rmcp = { version = "3.5", features = ["server", "transport-io", "macros", "schemars", "base64"] }
schemars = "1"
