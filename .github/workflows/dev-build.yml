# Builds AAE for Windows from every push to master and publishes it as the
# "dev" prerelease, replacing the last one, so it can be tried before a
# stable release. The download link stays the same:
# https://github.com/aaron-gh/accessible-android-emulator/releases/download/dev/AAE-dev-windows-x64.zip
name: Development build

on:
  push:
    branches: [master]
  workflow_dispatch:

# A newer push replaces a build still running.
concurrency:
  group: dev-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    # Built on a Mac, cross-compiled with MinGW-w64, exactly as windows/build.sh
    # does on Aaron's Mac.
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install MinGW-w64 and Rust's Windows target
        run: |
          brew install mingw-w64
          rustup target add x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows

      # eSpeak NG takes minutes to build and rarely changes, so it's kept
      # between builds, keyed on its source and how AAE builds it.
      - name: Find eSpeak NG's version
        id: espeak
        run: echo "commit=$(git -C android/third_party/espeak-ng rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: android/espeak/build
          key: espeak-${{ steps.espeak.outputs.commit }}-${{ hashFiles('android/espeak/aae.init.gradle', 'android/build-espeak.sh') }}

      - name: Set up AAE's Android signing key
        env:
          KEYSTORE: ${{ secrets.AAE_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE" ]]; then
            echo "The AAE_ANDROID_KEYSTORE_BASE64 secret is missing, so AAE's apps can't be signed." >&2
            exit 1
          fi
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/aae.keystore"
          echo "AAE_ANDROID_KEYSTORE=$RUNNER_TEMP/aae.keystore" >> "$GITHUB_ENV"

      - name: Build
        env:
          AAE_ANDROID_KEY_PASSWORD: ${{ secrets.AAE_ANDROID_KEY_PASSWORD }}
          AAE_ZIP_NAME: AAE-dev-windows-x64
        run: |
          export AAE_BUILD_LABEL="development build ${GITHUB_RUN_NUMBER}, from ${GITHUB_SHA::7}"
          windows/build.sh
          # Only apps signed with AAE's key go out.
          grep -qx aae android/espeak/build/signed-with

      - name: Publish the dev prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT=${GITHUB_SHA::7}
          SUBJECT=$(git log -1 --format=%s)
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          A development build of AAE for Windows, made from the latest change on master. It's for testing, before a stable release, and is replaced by each new change.

          Built from [$SHORT](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}): $SUBJECT

          Download AAE-dev-windows-x64.zip below, unzip it and run AccessibleAndroidEmulator.exe. README.txt in the zip explains what's needed and how it works. Help, About AAE, says which build you have; please include that, or a diagnostic report, when reporting a problem.

          In PowerShell, this fetches and unzips the latest one into your Downloads folder:

          \`\`\`
          irm https://github.com/${GITHUB_REPOSITORY}/releases/download/dev/AAE-dev-windows-x64.zip -OutFile ~/Downloads/AAE-dev.zip; Expand-Archive ~/Downloads/AAE-dev.zip ~/Downloads -Force
          \`\`\`
          NOTES
          git tag -f dev "$GITHUB_SHA"
          git push -f origin refs/tags/dev
          if gh release view dev >/dev/null 2>&1; then
            gh release edit dev --prerelease --latest=false --title "Development build ($SHORT)" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create dev --prerelease --latest=false --title "Development build ($SHORT)" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          fi
          gh release upload dev windows/dist/AAE-dev-windows-x64.zip --clobber
