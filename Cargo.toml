[workspace]
resolver = "3"
members = ["crates/aae-core", "crates/aae-cli", "crates/aae-ffi", "crates/aae-mcp", "crates/aae-windows"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/aaron-gh/accessible-android-emulator"
license = "Apache-2.0"

[workspace.dependencies]
aae-core = { path = "crates/aae-core" }
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "fs", "io-util", "signal"] }
tokio-stream = "0.1"
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
tonic-prost-build = "0.14"
protox = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
cpal = "0.18"
ringbuf = "0.5"
clap = { version = "4", features = ["derive"] }
directories = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uniffi = "0.32"
ureq = "3"
sha1 = "0.11"
sha2 = "0.11"
roxmltree = "0.21"
signalsmith-stretch = "0.1"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
